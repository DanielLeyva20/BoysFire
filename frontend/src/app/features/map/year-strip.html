<div class="flex items-end gap-px overflow-x-auto" role="group" aria-label="Elegir año">
  @for (bar of bars(); track bar.year) {
    <button type="button"
            class="group flex min-w-7 flex-1 flex-col items-stretch"
            [attr.aria-pressed]="bar.year === selectedYear()"
            [attr.aria-label]="bar.description"
            [title]="bar.description"
            (click)="yearSelect.emit(bar.year)">
      <span class="flex h-12 flex-col justify-end" aria-hidden="true">
        <span class="hatch text-ink-3 group-aria-pressed:text-accent" [style.height.%]="bar.backgroundHeight"></span>
        <span class="bg-ink-3 transition-colors duration-150 group-hover:bg-ink group-aria-pressed:bg-accent"
              [style.height.%]="bar.detectedHeight"></span>
      </span>
      <span class="type-narrow border-t border-ink pt-0.5 text-center text-[0.6875rem] text-ink-2 group-aria-pressed:bg-accent group-aria-pressed:font-bold group-aria-pressed:text-paper">
        {{ bar.year }}
      </span>
    </button>
  } @empty {
    <div class="skeleton h-16 w-full" aria-hidden="true"></div>
  }
</div>
