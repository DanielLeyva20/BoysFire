[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boysfire-processing"
version = "0.1.0"
description = "Ingesta y armonización de focos de calor MODIS + VIIRS (NASA FIRMS) para Perú"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "h3>=4.1",
    "shapely>=2.1",
    "pyodbc>=5.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
boysfire = "boysfire.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
