name: boysfire

services:
  # Motor de base de datos.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?define MSSQL_SA_PASSWORD en .env}
      MSSQL_MEMORY_LIMIT_MB: 3072
    ports:
      - "127.0.0.1:${DB_PORT:-14330}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  # Crea la base y el usuario de la aplicación (una sola vez; es idempotente).
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      DB_NAME: ${DB_NAME:-boysfire}
      DB_APP_USER: ${DB_APP_USER:-boysfire_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?define DB_APP_PASSWORD en .env}
    volumes:
      - ./db/init:/db-init:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        /opt/mssql-tools18/bin/sqlcmd -C -b -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD"
        -v DB_NAME="$$DB_NAME" DB_APP_USER="$$DB_APP_USER" DB_APP_PASSWORD="$$DB_APP_PASSWORD"
        -i /db-init/create_database.sql
    restart: "no"

  # Aplica las migraciones versionadas de db/migrations.
  db-migrate:
    image: flyway/flyway:11
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      FLYWAY_URL: jdbc:sqlserver://sqlserver:1433;databaseName=${DB_NAME:-boysfire};encrypt=true;trustServerCertificate=true
      FLYWAY_USER: sa
      FLYWAY_PASSWORD: ${MSSQL_SA_PASSWORD}
      FLYWAY_PLACEHOLDERS_APPUSER: ${DB_APP_USER:-boysfire_app}
      FLYWAY_CONNECT_RETRIES: 10
    volumes:
      - ./db/migrations:/flyway/sql:ro
    command: migrate
    restart: "no"

volumes:
  sqlserver_data:
