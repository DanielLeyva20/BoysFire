spring:
  application:
    name: boysfire-api
  config:
    # Las credenciales viven en el .env de la raíz del repositorio (no se versiona).
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: jdbc:sqlserver://${DB_HOST:127.0.0.1}:${DB_PORT:14330};databaseName=${DB_NAME:boysfire};encrypt=true;trustServerCertificate=true
    username: ${DB_APP_USER}
    password: ${DB_APP_PASSWORD}
    hikari:
      maximum-pool-size: 10
  cache:
    type: caffeine
    caffeine:
      # Los datos cambian solo cuando corre el pipeline: 10 minutos de caché bastan.
      spec: maximumSize=2000,expireAfterWrite=10m
  mvc:
    problemdetails:
      enabled: true
  http:
    clients:
      connect-timeout: 10s
      read-timeout: 30s

server:
  port: ${API_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/geo+json,application/problem+json
    min-response-size: 1024

springdoc:
  swagger-ui:
    path: /swagger-ui.html

boysfire:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://*.ngrok-free.dev,https://*.ngrok-free.app}
  limits:
    hotspot-max-days: 31        # rango máximo de fechas al pedir focos individuales
    hotspot-default-limit: 20000
    hotspot-max-limit: 50000
    map-cell-max-days: 366      # rango máximo al pedir celdas agregadas del mapa
    region-search-max-results: 20
  operations:
    # Clave que deben enviar los operadores (cabecera X-Operator-Key) para usar /api/ops/**.
    # Sin clave, esas rutas quedan deshabilitadas.
    operator-key: ${OPERATOR_KEY:}
    report-rate-limit: 5          # reportes por persona (IP) …
    report-rate-window: 10m       # … en esta ventana de tiempo
  risk:
    refresh-interval: 3h          # cada cuánto se renueva el clima y se recalcula el riesgo
    refresh-initial-delay: 20s
    forecast-days: 7
    past-days: 30                 # historia de lluvia para contar los días secos
    weather-batch-size: 50        # ubicaciones por consulta a Open-Meteo
    weather-base-url: https://api.open-meteo.com/v1/forecast
    hotspot-window-days: 3        # focos de los últimos N días cuentan como "foco detectado"
    hotspot-max-age-days: 7       # con datos de focos más viejos, el factor no se aplica
    active-fire-alert-detections: 10
  monitoring:
    interval: 15m
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    poll-interval: 4s
    api-base-url: https://api.telegram.org
    app-url: ${PUBLIC_APP_URL:http://localhost:4200}
